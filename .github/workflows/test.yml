name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core tests
        run: dotnet test tests/ClaimsOps.Core.Tests/ClaimsOps.Core.Tests.csproj --configuration Release
      - name: API integration tests
        run: dotnet test tests/ClaimsOps.Api.Tests/ClaimsOps.Api.Tests.csproj --configuration Release
      - name: Build API
        run: dotnet build src/ClaimsOps.Api/ClaimsOps.Api.csproj --configuration Release --no-restore
      - name: Build Docker image
        run: docker build -t claimsops-ci .
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/claimsops
          docker tag claimsops-ci "$IMAGE:latest"
          docker tag claimsops-ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
